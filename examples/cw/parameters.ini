#author: Sreekanth Harikumar

#*****************************************#
[Source]
#*****************************************#

# Gravitational wave frequency of the source
frequency = 100
#Ds : Distance to source in kpc
Ds = 16

#*****************************************#
[Lens]
#*****************************************#

#Model of the lens
lensmodel = point
# Mass of the lens in solar mass
lensmass = 1000 
#Dl :  Distance to lens in kpc
Dl = 8
#Distance between lens and source in kpc (might be modified in the future to be computed from Dl and Ds or redshift)
Dls = 8
#*****************************************#
[Microlens]
#*****************************************#

#v :  velocity of the lens (not relative velocity) in 1 km/s
v = 200
# The micorlensing closest impact parameter y0 in literature
closest_approach = 0.01
# Time at which the maximum peak is observed
Time_of_closest_approach = 0
#Period of observation
Tobs = 1000
#sampling_number. Set it low for speed but this will affect accuracy.
Number_of_samples = 1000

#*****************************************#
[Output]
#*****************************************#

#Name of the output folder in which the results are stored
outdir = outdir

#*****************************************#
[Plots]
#*****************************************#

generate_plots = True
#*****************************************#
[tdfstat]
starting_gpstime=1000000000
nseg=3
nod=6
bandwidth=0.5
ov=5.0
detectors=H1,L1,V1
psd-dict={H1:../psd/psd_aLIGO_O4high.txt , L1:../psd/psd_aLIGO_O4high.txt , V1: ../psd/psd_aVirgo_O4high.txt  }
band=33
output_dir=cwlens
sun-ephem= sun00-40-DE405.dat
earth-ephem= earth00-40-DE405.dat
write_signal=True
lensing=True

[cwsignal]
frequency = 26.4
spin_down = 0.0
h0 = 1e-26
ra = 3.86687548714555
dec = 0.74835013347064
wobble_angle=1.5707963267948966
inclination=2.984905359501588
polarization=0.61465097870534
reference_phase=0.11626181938654

[lensing]
lens_model = point
lens_lookup_table = result_point.hdf5
lens_mass = 10000
velocity = 200
Distance_to_lens = 8
Distance_to_source = 16
#dimensionless_frequency = 10
closest_approach = 0.01
m_pbh = 100
f_pbh = 1.0


#*****************************************#
[Inference] 
#*****************************************#
recovery_lensmodel = point
recovery_lens_table = #path/to/lens/table.hdf5
injection_lensmodel = point
injection_lens_table = #path/to/lens/table.hdf5


[Interpolation]


filename = result_point
lensmodel = point
mpi = True #if True, the interpolation will be done using MPI parallelization. If False, it will be done using multiprocessing
n-parallel = 4
precision = 20

dimensionless_frequency_lower_limit =  0.00001
dimensionless_frequency_upper_limit =  100
dimensionless_frequency_samples =  1000
dimensionless_frequency_gridspace = linear

impact_parameter_lower_limit = 0.01
impact_parameter_upper_limit  = 1
impact_parameter_samples = 1
impact_parameter_gridspace = linear

scale_radius_lower_limit = 2.1
scale_radius_upper_limit = 3
scale_radius_samples = 2

powerlaw_coreradius = 0.1
powerlaw_amplitude = 1.0
powerlaw_exponent = 1.0

f_pbh_lower_limit = 0.5
f_pbh_upper_limit = 1.0
f_pbh_samples = 1.0
f_pbh_gridspace = linear

m_pbh_lower_limit =  10
m_pbh_upper_limit = 1000
m_pbh_samples = 1
m_pbh_gridspace = linear

cis_coreradius = 0.1
cis_coreradius_lower_limit = 
cis_coreradius_upper_limit = 
cis_coreradius_samples = 
cis_coreradius_gridspace = linear


