# gwlens_pipe example: point-lens injection and recovery
label = lensed_point
outdir = outdir_lensed_point
accounting = ligo.dev.o4.cbc.pe.bilby
detectors = [H1, L1]
duration = 4
sampling-frequency = 2048
minimum-frequency = 20
maximum-frequency = 1024
trigger-time = 1126259462.4
gaussian-noise = True
injection = True
injection-dict = {chirp_mass: 30, mass_ratio: 0.8, a_1: 0, a_2: 0, tilt_1: 0, tilt_2: 0, phi_12: 0, phi_jl: 0, luminosity_distance: 500, dec: 0.2, ra: 1.0, theta_jn: 0.4, psi: 0.3, phase: 1.0, geocent_time: 1126259462.4, MLz: 300, y: 0.5}
prior-file = example_lens.prior          # must contain MLz and y (and shape parameters, e.g. rc = 0.1)
waveform-approximant = IMRPhenomXPHM
generation-pool=local
frequency-domain-source-model = lal_binary_black_hole
sampler = dynesty
sampler-kwargs = {nlive: 1000}

# GWLENS Arguments

lens-model = point                       # point, sis, cis, nfw, binary_point, point_shear, or mymodule.my_lens
lens-solver = 1d                       # auto | 1d | 2d (Using auto will run 2d, more expensive )
lensed-injection = True                  # inject with the lensed waveform
lensed-recovery = True                   # recover with the lensed waveform
use-lookup-table = False                 # True: interpolate lens-lookup-table (generated from the prior if missing)

# lens-lookup-table = /path/to/table.hdf5
# lensed-lookup-generation = True
# lens-lookup-npool = 4
# lens-lookup-kwargs = {dw: 0.05, dy: 0.002}
