[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gwlens"
version = "0.1.7"
description = "Gravitational lensing CLI"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "finufft",
    "joblib",
    "astropy",
    "mpmath",
    "tqdm",
    "matplotlib",
    "bilby",
    "bilby_pipe",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "myst-parser>=4",
    "sphinx-copybutton",
    "sphinx_design",
    "nbsphinx",
    "pandoc",
    "sphinx-autobuild>=2024.2.4",
]

[project.scripts]
gwlens_interpolate = "gwlens.tools.interpolator:interpolate"
gwlens_microlensing = "gwlens.tools.executor:execute"
gwlens_generate_default_ini = "gwlens.tools.generate_ini:main"
gwlens_pipe = "gwlens.pe.main:main"
gwlens_cw_datagen = "gwlens.tdfstat.datagen:main"
